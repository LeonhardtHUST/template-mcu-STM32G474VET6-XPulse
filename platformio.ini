; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = Core/Src
include_dir = Core/Inc
; 本仓库自带的板级定义（PlatformIO 官方没有 G474VET6 的 board），
; 用 boards_dir 挂载，board 名见下方 env 的 board 字段。
boards_dir = boards
; test/ 使用系统 gcc 运行主机回归，不使用 pio test / Unity。
; 它位于 src_dir 之外，不参与固件构建。

[env:genericSTM32G474VE]
platform = ststm32@20.0.0
platform_packages =
    platformio/framework-stm32cubeg4@1.6.3
    platformio/toolchain-gccarmnoneeabi@1.70201.0
    platformio/tool-ldscripts-ststm32@0.3.0
    platformio/tool-openocd@3.1200.7
board = genericSTM32G474VE
framework = stm32cube
board_build.stm32cube.custom_config_header = yes
; framework 自带 Drivers/CMSIS/.../system_stm32g4xx.c，排除工程内的同名文件，
; 否则会出现重复定义符号。
build_src_filter = +<*> -<system_stm32g4xx.c>
; 严格告警仅施加于工程源码，HAL/CMSIS 使用包自身的编译选项。
build_src_flags =
	-std=c11
	-Wall
	-Wextra
	-Werror
build_flags =
	-fdata-sections
	-ffunction-sections
	-Wl,--gc-sections
	-Wl,--print-memory-usage
	-Wl,-Map=${BUILD_DIR}/firmware.map
; 使用 printf("%f") 时取消下一行注释；newlib-nano 默认不包含浮点格式化。
; 会额外占用 Flash/RAM，最小闪灯模板不默认拉入。
;	-Wl,-u,_printf_float
; 默认烧录/调试探针：ST-Link，使用 SWD。
; 改用 CMSIS-DAP 时同步切换这两项及 VS Code 的 OpenOCD 配置文件。
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
